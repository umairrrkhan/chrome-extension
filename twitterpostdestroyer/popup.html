<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post Destroyer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="m12 8-1 7m0-5-5 3m5-3 5 3m-5 2-4 6m4-6 5 6"/></svg></span><strong>post destroyer</strong><span class="version">1.1</span></header>
  <main>
    <h1>A cleaner timeline.</h1>
    <p class="intro">Pick a tool. Let the little guy handle it.</p>
    <section class="enable-row"><div><strong>Enable on X / Twitter</strong><span id="status">Loading settings…</span></div><button id="enabled" class="toggle on" aria-label="Enable extension" aria-pressed="true" disabled></button></section>
    <div class="section-label">YOUR TOOL <span>Shortcuts 1–3</span></div>
    <div class="weapons"><button class="weapon selected" data-weapon="rpg" aria-pressed="true"><span class="weapon-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 15 9-9 4 4-9 9-4-4Zm9-9 2-3 5 0 0 5-3 2M6 18l-3 3m1-7-2 2m8 4-2 2"/></svg></span><span><strong>Rocket launcher</strong><small>A little extra firepower.</small></span><span class="key">1</span></button><button class="weapon" data-weapon="hammer" aria-pressed="false"><span class="weapon-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 9-9m-3-4 7 7 4-4-7-7-4 4Z"/></svg></span><span><strong>Hammer</strong><small>The hands-on approach.</small></span><span class="key">2</span></button><button class="weapon" data-weapon="laser" aria-pressed="false"><span class="weapon-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 2-9 12h6l-1 8 9-12h-6l1-8Z"/></svg></span><span><strong>Laser</strong><small>A clean, precise exit.</small></span><span class="key">3</span></button></div>
    <div class="sound-row"><span>Sound effects <small>Off by default</small></span><button id="sound" class="toggle" aria-label="Sound effects" aria-pressed="false" disabled></button></div>
    <p id="error" role="status" hidden></p>
    <button class="primary" id="open-x">Open X / Twitter <span aria-hidden="true">→</span></button>
    <button class="secondary" id="playground">Try the playground</button>
  </main>
  <footer><span>By Umair Khan</span><a class="sponsor" href="https://umair.sbs/pay/" target="_blank" rel="noopener noreferrer">Sponsor this project <span aria-hidden="true">↗</span></a></footer>
  <script src="popup.js"></script>
</body>
</html>
